<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — PocketSmart AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-mark">
        PocketSmart <span class="brand-accent">AI</span>
      </a>
      <div class="header-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="main-content auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Plan smart budgets with personalized AI recommendations.</p>
      </div>

      <div id="errorAlert" class="alert alert-error" style="display: none;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="Alex Mercer" required minlength="2">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="alex@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
