<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PocketSmart AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-mark">
        PocketSmart <span class="brand-accent">AI</span>
      </a>
      <div class="header-actions">
        <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main class="main-content auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your personal dashboard and history.</p>
      </div>

      <div id="errorAlert" class="alert alert-error" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Sign In
        </button>
      </form>

      <div class="demo-box">
        <span>Try Demo Account:</span>
        <button type="button" id="fillDemoBtn" class="demo-fill-btn">Autofill Credentials</button>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
